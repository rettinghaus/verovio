name: Test Suite Evaluation

on:
  pull_request:
    branches: [develop]
  # TODO: run this task only on PR in production; use push event for testing
  #push:
    #branches:
    # - '**'

# globals
env:
  # general settings
  MAIN_REPO_OWNER: rism-digital # Main repo owner (default: rism-digital; should not be changed)

  # build artifacts
  TOOLKIT_BUILD: toolkit-build

  # gh-pages
  GH_PAGES_REPO: ${{ github.repository_owner }}/verovio.org # works from rism-digital and from forks
  GH_PAGES_BRANCH: gh-pages

  # directories
  GH_PAGES_DIR: gh-pages-dir
  PR_DIR: pr-${{ github.event.pull_request.head.sha }}
  DEV_DIR: dev-dir
  TEMP_DIR: temp-dir

jobs:
  ###################################################
  # Build the Python toolkit and run the test suite #
  ###################################################
  build_python:
    name: Build the test suite
    runs-on: ubuntu-24.04

    steps:
      - uses: FranzDiebold/github-env-vars-action@v2.9.0
      - name: Get Short SHA
        run: |
          echo "SHORT_SHA=`echo ${{ github.event.pull_request.head.sha }} | cut -c1-7`" >> $GITHUB_ENV

      - name: Add additional environment variables for creating URL slugs
        run: |
          echo "OUTPUT_DIR=${{ github.event.pull_request.number }}/${{ env.SHORT_SHA }}" >> $GITHUB_ENV

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download GH_PAGES_BRANCH ZIP into GH_PAGES_DIR
        run: |
          mkdir -p ${{ env.GH_PAGES_DIR }}
          cd ${{ github.workspace }}
          curl -L -o gh-pages.zip https://github.com/${{ env.GH_PAGES_REPO }}/archive/refs/heads/${{ env.GH_PAGES_BRANCH }}.zip
          unzip -q gh-pages.zip -d ${{ env.GH_PAGES_DIR }}
          rm gh-pages.zip
          root=$(find ${{ env.GH_PAGES_DIR }} -maxdepth 1 -mindepth 1 -type d | head -n 1)
          if [ -n "$root" ]; then
            shopt -s dotglob
            mv "$root"/* ${{ env.GH_PAGES_DIR }}/
            rmdir "$root"
          fi

      - name: Create directories, install dependencies, and fetch packages
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p ${{ env.DEV_DIR }} ${{ env.PR_DIR }} ${{ env.TEMP_DIR }}/${{ env.DEV_DIR }} ${{ env.TEMP_DIR }}/${{ env.PR_DIR }} ${{ env.OUTPUT_DIR }}
          sudo apt-get install wireguard
          sudo echo "${{ secrets.VPN_CONFIGURATION }}" > wg0.conf
          python3 -m venv .venv-dev
          python3 -m venv .venv-pr
          .venv-dev/bin/pip install --upgrade pip build diffimg jsondiff lxml xmldiff cairosvg
          .venv-pr/bin/pip install --upgrade pip build diffimg jsondiff lxml xmldiff cairosvg

          curl -L -o dev.zip https://github.com/${{ env.MAIN_REPO_OWNER }}/verovio/archive/refs/heads/develop.zip
          curl -L -o pr.zip https://github.com/${{ github.event.pull_request.head.repo.full_name }}/archive/${{ github.event.pull_request.head.sha }}.zip
          .venv-dev/bin/pip install dev.zip
          .venv-pr/bin/pip install pr.zip

          unzip -q dev.zip '*/doc/*' -d ${{ env.DEV_DIR }}
          unzip -q pr.zip '*/doc/*' -d ${{ env.PR_DIR }}
          rm dev.zip pr.zip

          root=$(find ${{ env.DEV_DIR }} -maxdepth 1 -mindepth 1 -type d | head -n 1)
          mv "$root/doc" ${{ env.DEV_DIR }}/
          rm -rf "$root"

          root=$(find ${{ env.PR_DIR }} -maxdepth 1 -mindepth 1 -type d | head -n 1)
          mv "$root/doc" ${{ env.PR_DIR }}/
          rm -rf "$root"

      - name: Build Python toolkit and run the tests for the dev branch
        working-directory: ${{ github.workspace }}/${{ env.DEV_DIR }}
        run: |
          set -euo pipefail
          ${{ github.workspace }}/.venv-dev/bin/python doc/test-suite.py ${{ github.workspace }}/${{env.GH_PAGES_DIR}}/_tests ${{ github.workspace }}/${{ env.TEMP_DIR }}/${{ env.DEV_DIR }}/
          ${{ github.workspace }}/.venv-dev/bin/python doc/test-suite.py ${{ github.workspace }}/${{env.GH_PAGES_DIR}}/musicxmlTestSuite ${{ github.workspace }}/${{ env.TEMP_DIR }}/${{ env.DEV_DIR }}/

      - name: Build Python toolkit and run the tests for the PR
        working-directory: ${{ github.workspace }}/${{ env.PR_DIR }}
        run: |
          set -euo pipefail
          ${{ github.workspace }}/.venv-pr/bin/python doc/test-suite.py ${{ github.workspace }}/${{env.GH_PAGES_DIR}}/_tests ${{ github.workspace }}/${{ env.TEMP_DIR }}/${{ env.PR_DIR }}/
          ${{ github.workspace }}/.venv-pr/bin/python doc/test-suite.py ${{ github.workspace }}/${{env.GH_PAGES_DIR}}/musicxmlTestSuite ${{ github.workspace }}/${{ env.TEMP_DIR }}/${{ env.PR_DIR }}/

      - name: Compare the tests
        working-directory: ${{ github.workspace }}/${{ env.DEV_DIR }}/doc
        run: |
          ${{ github.workspace }}/.venv-dev/bin/python ./test-suite-diff.py ${{ github.workspace }}/${{ env.TEMP_DIR }}/${{ env.PR_DIR }}/ ${{ github.workspace }}/${{ env.TEMP_DIR }}/${{ env.DEV_DIR }}/ ${{ github.workspace }}/${{ env.OUTPUT_DIR }}/
          ls -al

      - name: Round-trip evaluation
        working-directory: ${{ github.workspace }}/${{ env.PR_DIR }}
        run: |
          ${{ github.workspace }}/.venv-pr/bin/python doc/test-suite-roundtrip.py ${{ github.workspace }}/${{env.GH_PAGES_DIR}}/_tests ${{ github.workspace }}/${{ env.OUTPUT_DIR }}/
          ls -al

      - name: Upload results as artefacts
        uses: actions/upload-artifact@v7
        with:
          name: test-suite-diff
          path: ${{ github.workspace }}/${{ env.OUTPUT_DIR }}/

      - name: Check existence of the log.md file
        id: check_files
        uses: andstor/file-existence-action@v3
        with:
          files: "${{ github.workspace }}/${{ env.OUTPUT_DIR }}/log.md"

      - name: Show the list of changes detected
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          echo "This is the list of tests for which a change has been detected:"
          cat ${{ github.workspace }}/${{ env.OUTPUT_DIR }}/log.md
